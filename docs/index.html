<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini ChatGPT — Live Demo | Hammad Durrani</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b1020; --panel:#141b2d; --text:#e8eefc; --muted:#93a0bd; --accent:#6ea8fe; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"DM Sans",system-ui; color:var(--text); min-height:100vh;
      background: radial-gradient(800px 420px at 20% -10%, rgba(110,168,254,.22), transparent), var(--bg); }
    .wrap { max-width:720px; margin:0 auto; padding:36px 18px 80px; }
    h1 { font-family:Fraunces,Georgia,serif; margin:0 0 8px; }
    .lead { color:var(--muted); line-height:1.55; }
    .badge { display:inline-block; margin:12px 0 16px; padding:4px 10px; border-radius:999px; background:var(--accent); color:#0b1020; font-size:12px; font-weight:700; }
    #log { background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:16px; min-height:360px; max-height:55vh; padding:16px; overflow:auto; }
    .msg { margin:10px 0; padding:12px 14px; border-radius:12px; max-width:88%; line-height:1.5; font-size:14px; white-space:pre-wrap; }
    .user { background:rgba(110,168,254,.18); margin-left:auto; }
    .bot { background:rgba(255,255,255,.05); }
    .row { display:flex; gap:8px; margin-top:12px; }
    input { flex:1; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:#0f1628; color:var(--text); font:inherit; }
    button { padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#0b1020; font-weight:700; cursor:pointer; }
    footer { margin-top:24px; color:var(--muted); font-size:14px; }
    footer a { color:var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mini ChatGPT</h1>
    <p class="lead">Static portfolio demo of the ChatGPT-style UI flow. Full multi-provider stack (React + Express + optional FastAPI) runs locally from the repo — this page shows demo replies without a backend.</p>
    <span class="badge">STATIC DEMO · no API key</span>
    <div id="log"></div>
    <div class="row">
      <input id="q" placeholder="Say hello, or ask for a TypeScript snippet…" />
      <button id="send" type="button">Send</button>
    </div>
    <footer>
      By <a href="https://github.com/hammad-ml-dev">Hammad Durrani</a> ·
      <a href="https://github.com/hammad-ml-dev/Mini-chatgpt">Clone for full stack</a>
    </footer>
  </div>
  <script>
    const log = document.getElementById("log");
    const add = (who, text) => {
      const d = document.createElement("div");
      d.className = "msg " + who;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    };
    const reply = (q) => {
      const lower = q.toLowerCase();
      if (/hello|hi\b/.test(lower)) return "Hello! This is Mini ChatGPT demo mode. Clone the repo and run client + server for OpenAI / Groq / Ollama / Hugging Face.";
      if (/code|typescript|python/.test(lower)) return "Demo snippet:\n\nexport function greet(name) {\n  return `Hello, ${name}!`;\n}\n\nConfigure .env for live models.";
      return `(Demo) You said: "${q.slice(0, 280)}"\n\nLive generation needs the Express API + a provider key or Ollama.`;
    };
    const send = () => {
      const q = document.getElementById("q").value.trim();
      if (!q) return;
      document.getElementById("q").value = "";
      add("user", q);
      add("bot", reply(q));
    };
    document.getElementById("send").onclick = send;
    document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    add("bot", "Welcome to Mini ChatGPT. Try “hello” or ask for TypeScript code — then clone the repo for the real multi-provider app.");
  </script>
</body>
</html>
